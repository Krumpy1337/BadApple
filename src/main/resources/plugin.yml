name: BadApple
version: '${version}'

main: com.krumpy1337.badapple.BadApple
api-version: '26.3'

load: STARTUP
authors: [Krumpy1337]
description: Permissions Plugin for Managing Nodes, Groups, & More
website: https://github.com/Krumpy1337

commands:
  group:
    description: Manage groups and permissions for BadApple
    usage: /group <create|delete|setprefix|setweight|setinherit|addperm|removeperm|adduser|removeuser|list>
    permission: badapple.group
    permission-message: §cYou do not have permission to manage groups.
  groupmenu:
    description: Open the BadApple group manager GUI
    usage: /groupmenu
    permission: badapple.group
    permission-message: §cYou do not have permission to manage groups.
  punishmenu:
    description: Open the BadApple punish menu GUI
    usage: /punishmenu
    permission: badapple.punish
    permission-message: §cYou do not have permission to punish players.
  vanish:
    description: Toggle vanish mode for staff members
    usage: /vanish
    permission: badapple.vanish
    permission-message: §cYou do not have permission to vanish.
  broadcast:
    description: Send a server-wide announcement
    usage: /broadcast <message>
    permission: badapple.broadcast
    permission-message: §cYou do not have permission to broadcast.
  fly:
    description: Toggle flight for yourself or another player
    usage: /fly [player] [on|off]
    permission: badapple.fly
    permission-message: §cYou do not have permission to toggle fly.
  gamemode:
    description: Set a gamemode for yourself or another player
    usage: /gamemode <survival|creative|adventure|spectator> [player]
    permission: badapple.gamemode
    permission-message: §cYou do not have permission to change gamemodes.
  nickname:
    description: Set or clear a display nickname
    aliases: [nick]
    usage: /nickname <nickname> | /nickname <player> <nickname> | /nickname clear [player]
    permission: badapple.nickname
    permission-message: §cYou do not have permission to change nicknames.
  badapplehelp:
    description: Show the BadApple help menu with multi-page command info
    aliases: [help]
    usage: /badapplehelp [page]
  compass:
    description: Open the proxy server selector
    usage: /compass
    permission: badapple.tp
    permission-message: §cYou do not have permission to use the server selector.
  chunkmenu:
    description: Open the chunk pre-generation management GUI
    usage: /chunkmenu
    permission: badapple.chunkpregeneration
    permission-message: §cYou do not have permission to manage chunk pre-generation.
  chunkpregeneration:
    description: Manage chunk pre-generation directly
    aliases: [chunkpregen, pregen]
    usage: /chunkpregeneration <status|pause|resume|cancel>
    permission: badapple.chunkpregeneration
    permission-message: §cYou do not have permission to manage chunk pre-generation.
  api:
    description: Generate or revoke a server API key
    usage: /api [generate|rotate|revoke|status]
    permission: badapple.api
    permission-message: §cYou do not have permission to manage API keys.
  cosmetics:
    description: Open the cosmetics menu to toggle unlocked trails and particles
    usage: /cosmetics
    permission: badapple.cosmetics
    permission-message: §cYou do not have permission to manage cosmetics.
  tp:
    description: Staff teleport menu or target teleport command
    usage: /tp [player]
    permission: badapple.tp
    permission-message: §cYou do not have permission to teleport.
    allow-override: true
  tpa:
    description: Request to teleport to a staff member
    usage: /tpa <player>
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
    permission: badapple.tp
    permission-message: "§cStaff only: you do not have permission to accept teleport requests."
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
    permission: badapple.tp
    permission-message: "§cStaff only: you do not have permission to deny teleport requests."
