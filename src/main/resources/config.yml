# Folder names
groupsFolder: "groups"

# Proxy integration (set to 'velocity' to enable compass/server selector)
proxy:
  type: ""

# Logical name for this backend. Used to suppress giving the server-selector on the SMP backend (set to 'smp').
server:
  name: ""

# Authenticated server API. Keep bound to localhost and expose it only through a TLS reverse proxy.
api:
  enabled: true
  bind-address: "127.0.0.1"
  port: 8787
  public-url: ""
  provisioning-key: ""

# Chunk pre-generation settings
pregeneration:
  default-radius: 8
  max-radius: 2048
  chunks-per-tick: 2
